name: Vérification du code

on:
  push:
    branches:
      - refonte-fiches-marchands-v1
      - preparation-production-joueclub
      - joueclub-v2-design
      - joueclub-v3-polish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    name: TypeScript et lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: yarn

      - name: Installer les dépendances
        run: yarn install --frozen-lockfile

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Vérifier TypeScript
        run: npx tsc --noEmit

      - name: Vérifier ESLint sur la nouvelle fiche
        run: npx next lint --file components/business/TestSellerPage.tsx --no-cache

      - name: Vérifier la compilation Next.js
        run: yarn build
