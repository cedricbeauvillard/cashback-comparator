
name: Vérification du code

on:
  push:
    branches:
      - refonte-fiches-marchands-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    name: TypeScript et lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Vérifier TypeScript sur tout le projet
        run: npx tsc --noEmit

      - name: Vérifier ESLint sur les fichiers de la refonte
        run: |
          npx next lint --no-cache \
            --file components/business/ItemCashbackerDesktop.tsx \
            --file components/business/ItemCashbackerMobile.tsx \
            --file pages/seller/'[...pid].tsx'
